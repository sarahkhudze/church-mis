{% extends 'base.html' %}

{% block title %}Deactivate User - Church CMS{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-ban"></i> Deactivate User</h4>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to deactivate <strong>{{ user.get_full_name }}</strong>?</p>
                    <p class="text-danger">This user will not be able to log in until reactivated.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Deactivate</button>
                        <a href="{% url 'accounts:user_management' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
